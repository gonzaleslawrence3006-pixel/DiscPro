<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscPro - Seller Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        #scanner-container video, #scanner-container canvas {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">DiscPro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/feed">Live Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="/seller/1/dashboard">Store 1 (Sarisari)</a></li>
                <li class="nav-item"><a class="nav-link" href="/seller/2/dashboard">Store 2 (Bakeshop)</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0" th:text="${seller.storeName}">Store Name</h2>
            <p class="text-muted mb-0" th:text="${seller.address} + ' • Managed by ' + ${seller.name}">Address</p>
        </div>
        <span class="badge bg-warning text-red fs-6" th:text="'Policy: ' + ${seller.discountPolicyType}">Policy</span>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">List Sealed Near-Expiry Item</h5>

                    <div class="mb-3">
                        <button type="button" id="start-scan-btn" class="btn btn-outline-red btn-sm w-100 mb-2">
                            Scan Product Barcode (Camera)
                        </button>
                        <div id="scanner-container" class="d-none bg-red p-1 rounded"></div>
                    </div>

                    <form th:action="@{/seller/{id}/products(id=${seller.id})}" th:object="${newProduct}" method="post">
                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Factory Barcode (8-14 digits)</label>
                            <input type="text" id="barcode" th:field="*{barcode}" class="form-control" placeholder="e.g. 4800016644801" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Product Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Fresh Milk 1L" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Category</label>
                                <select th:field="*{category}" class="form-select">
                                    <option value="Dairy">Dairy</option>
                                    <option value="Bread">Bread</option>
                                    <option value="Snacks">Snacks</option>
                                    <option value="Canned Goods">Canned Goods</option>
                                    <option value="Beverages">Beverages</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Original Price (₱)</label>
                                <input type="number" step="0.01" th:field="*{originalPrice}" class="form-control" placeholder="100.00" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-7">
                                <label class="form-label small fw-semibold">Stamped Expiry Date</label>
                                <input type="date" th:field="*{expiryDate}" class="form-control" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}"></div>
                            </div>
                            <div class="col-5">
                                <label class="form-label small fw-semibold">Quantity</label>
                                <input type="number" th:field="*{quantity}" class="form-control" value="1" min="1" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-red w-100 fw-semibold">Calculate Discount &amp; Publish</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Your Active Listings</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Item &amp; Barcode</th>
                                    <th>Expiry</th>
                                    <th>Price</th>
                                    <th>Qty</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${products}">
                                    <td>
                                        <div class="fw-bold" th:text="${item.name}">Name</div>
                                        <small class="text-muted" th:text="${item.barcode}">Barcode</small>
                                    </td>
                                    <td th:text="${item.expiryDate}">2026-11-25</td>
                                    <td>
                                        <span class="text-decoration-line-through text-muted small" th:text="'₱' + ${item.originalPrice}">₱0</span><br>
                                        <strong class="text-red" th:text="'₱' + ${item.discountedPrice}">₱0</strong>
                                        <span class="badge bg-danger ms-1" th:text="'-' + ${item.discountPercentageDisplay} + '%'">-30%</span>
                                    </td>
                                    <td th:text="${item.quantity}">1</td>
                                    <td>
                                        <form th:action="@{/seller/{sid}/products/{pid}/delete(sid=${seller.id}, pid=${item.id})}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<script>
    const scanBtn = document.getElementById('start-scan-btn');
    const scannerContainer = document.getElementById('scanner-container');
    let scanning = false;

    scanBtn.addEventListener('click', () => {
        if (scanning) {
            Quagga.stop();
            scannerContainer.classList.add('d-none');
            scanBtn.textContent = 'Scan Product Barcode (Camera)';
            scanning = false;
            return;
        }

        scannerContainer.classList.remove('d-none');
        scanBtn.textContent = 'Stop Camera';
        scanning = true;

        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: scannerContainer,
                constraints: { facingMode: "environment" }
            },
            decoder: {
                readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"]
            }
        }, function(err) {
            if (err) {
                alert("Camera uprimaryailable: " + err);
                scannerContainer.classList.add('d-none');
                scanning = false;
                return;
            }
            Quagga.start();
        });

        Quagga.onDetected(function(result) {
            const code = result.codeResult.code;
            if (code) {
                document.getElementById('barcode').value = code;
                Quagga.stop();
                scannerContainer.classList.add('d-none');
                scanBtn.textContent = 'Scan Product Barcode (Camera)';
                scanning = false;
            }
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
