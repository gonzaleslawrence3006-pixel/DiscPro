<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscPro - Buyer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">DiscPro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/feed">Live Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="/stores">Store Finder</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/buyer/dashboard">Buyer Dashboard</a></li>
                <li class="nav-item" th:if="${session.loggedInBuyerId != null}">
                    <a class="nav-link fw-semibold" href="/logout">Logout</a>
                </li>
                <li class="nav-item" th:if="${session.loggedInBuyerId == null}">
                    <a class="nav-link fw-semibold" href="/login">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="mb-4">
        <h2 class="fw-bold mb-0" th:text="'Welcome, ' + ${buyer.name}">Welcome, Buyer</h2>
        <p class="text-muted">
            Buyer ID: <strong th:text="${buyer.id}">3</strong> •
            <span th:text="'Neighborhood: ' + ${buyer.neighborhood}">Neighborhood</span>
        </p>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Your Saved Deals</h5>
                    <p class="text-muted small" th:if="${#lists.isEmpty(buyer.savedProducts)}">
                        You haven't saved any items yet. Click "Save" on any deal to track it here.
                    </p>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item px-0 d-flex justify-content-between align-items-center"
                             th:each="saved : ${buyer.savedProducts}">
                            <div>
                                <div class="fw-bold" th:text="${saved.name}">Item</div>
                                <small class="text-muted" th:text="${saved.seller.storeName} + ' • ₱' + ${saved.discountedPrice}">Store</small>
                            </div>
                            <form th:action="@{/buyer/save/{pid}(pid=${saved.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <h5 class="fw-bold mb-3">Available Neighborhood Deals</h5>
            <div class="row g-3">
                <div class="col-md-6" th:each="deal : ${deals}">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-body">
                            <span class="badge bg-danger mb-2" th:text="${deal.discountPercentageDisplay} + '% OFF'">50% OFF</span>
                            <h6 class="fw-bold" th:text="${deal.name}">Item</h6>
                            <p class="text-muted small mb-2" th:text="${deal.seller.storeName}">Store</p>
                            <div class="mb-2">
                                <span class="text-decoration-line-through text-muted small me-1" th:text="'₱' + ${deal.originalPrice}">₱0</span>
                                <strong class="text-red fs-5" th:text="'₱' + ${deal.discountedPrice}">₱0</strong>
                            </div>
                            <form th:action="@{/buyer/save/{pid}(pid=${deal.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-red w-100"
                                        th:text="${buyer.savedProducts.contains(deal)} ? 'Saved ✓ (Remove)' : 'Save / Toggle'">Save / Toggle</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
