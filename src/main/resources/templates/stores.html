<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscPro - Store Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 420px; width: 100%; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">DiscPro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/feed">Live Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="/stores">Store Finder</a></li>
                <li class="nav-item"><a class="nav-link" href="/buyer/dashboard">Buyer Dashboard</a></li>
                <li class="nav-item" th:if="${session.loggedInBuyerId != null}">
                    <a class="nav-link fw-semibold" href="/logout">Logout</a>
                </li>
                <li class="nav-item" th:if="${session.loggedInBuyerId == null}">
                    <a class="nav-link fw-semibold" href="/login">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container my-5">
    <h2 class="fw-bold mb-3">Participating Neighborhood Stores</h2>

    <form action="/stores" method="get" class="row g-2 mb-4">
        <div class="col-md-9">
            <input type="text" name="address" class="form-control" placeholder="Search by street, barangay, or city in Batangas..."
                   th:value="${searchQuery}">
        </div>
        <div class="col-md-3 d-grid">
            <button type="submit" class="btn btn-red">Search Stores</button>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-lg-7">
            <div id="map" class="shadow-sm border"></div>
        </div>
        <div class="col-lg-5">
            <div class="list-group shadow-sm">
                <div class="list-group-item" th:each="store : ${stores}">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="fw-bold mb-1" th:text="${store.storeName}">Store Name</h6>
                        <span class="badge bg-info text-red" th:text="${store.discountPolicyType}">STANDARD</span>
                    </div>
                    <p class="text-muted small mb-2" th:text="${store.address}">Address</p>
                    <a th:href="@{/seller/{id}/dashboard(id=${store.id})}" class="btn btn-sm btn-outline-red">View Store Inventory</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([13.7565, 121.0583], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('/api/stores')
        .then(res => res.json())
        .then(stores => {
            const bounds = [];
            stores.forEach(store => {
                if (store.latitude && store.longitude) {
                    const marker = L.marker([store.latitude, store.longitude]).addTo(map);
                    marker.bindPopup(`<strong>${store.storeName}</strong><br>${store.address}<br><em>Policy: ${store.policy}</em>`);
                    bounds.push([store.latitude, store.longitude]);
                }
            });
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
